<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社交系统 - 网页版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            height: 85vh;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            display: none;
        }

        .container.active {
            display: flex;
        }

        /* 登录注册页面 */
        .auth-container {
            width: 400px;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }

        .auth-container h1 {
            color: #667eea;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .auth-form input {
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .auth-form input:focus {
            outline: none;
            border-color: #667eea;
        }

        .auth-form button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .auth-form button:hover {
            transform: translateY(-2px);
        }

        .auth-toggle {
            margin-top: 20px;
            color: #666;
        }

        .auth-toggle a {
            color: #667eea;
            text-decoration: none;
            cursor: pointer;
        }

        .hidden {
            display: none !important;
        }

        /* 侧边栏 */
        .sidebar {
            width: 250px;
            background: linear-gradient(180deg, #2c3e50 0%, #34495e 100%);
            color: white;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .user-info {
            text-align: center;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .user-avatar {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 0 auto 15px;
        }

        .user-name {
            font-size: 18px;
            font-weight: bold;
        }

        .user-account {
            font-size: 12px;
            opacity: 0.7;
            margin-top: 5px;
        }

        .nav-menu {
            flex: 1;
            padding-top: 20px;
        }

        .nav-item {
            padding: 15px 20px;
            cursor: pointer;
            border-radius: 10px;
            margin-bottom: 5px;
            transition: background 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-item:hover, .nav-item.active {
            background: rgba(255,255,255,0.1);
        }

        .nav-item .icon {
            font-size: 20px;
        }

        .logout-btn {
            padding: 15px 20px;
            background: #e74c3c;
            border: none;
            color: white;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .logout-btn:hover {
            background: #c0392b;
        }

        /* 主内容区 */
        .main-content {
            flex: 1;
            background: #f5f6fa;
            overflow-y: auto;
        }

        .content-header {
            background: white;
            padding: 20px 30px;
            border-bottom: 1px solid #e0e0e0;
        }

        .content-header h2 {
            color: #2c3e50;
        }

        .content-body {
            padding: 30px;
        }

        /* 消息页面 */
        .friend-list {
            background: white;
            border-radius: 15px;
            padding: 20px;
        }

        .friend-item {
            display: flex;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            transition: background 0.2s;
        }

        .friend-item:hover {
            background: #f8f9fa;
        }

        .friend-avatar {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            margin-right: 15px;
        }

        .chat-window {
            background: white;
            border-radius: 15px;
            height: 500px;
            display: flex;
            flex-direction: column;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f8f9fa;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
        }

        .message.sent {
            flex-direction: row-reverse;
        }

        .message-content {
            max-width: 60%;
            padding: 12px 18px;
            border-radius: 18px;
            line-height: 1.4;
        }

        .message.received .message-content {
            background: white;
            border: 1px solid #e0e0e0;
        }

        .message.sent .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .message-time {
            font-size: 11px;
            color: #999;
            margin-top: 5px;
        }

        .chat-input {
            display: flex;
            padding: 15px;
            border-top: 1px solid #e0e0e0;
        }

        .chat-input input {
            flex: 1;
            padding: 12px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 14px;
        }

        .chat-input input:focus {
            outline: none;
            border-color: #667eea;
        }

        .chat-input button {
            margin-left: 10px;
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
        }

        /* 联系人页面 */
        .contact-section {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .contact-section h3 {
            color: #2c3e50;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }

        .contact-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-danger {
            background: #e74c3c;
            color: white;
        }

        .btn-success {
            background: #27ae60;
            color: white;
        }

        /* 动态页面 */
        .moment-input {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .moment-input textarea {
            width: 100%;
            min-height: 100px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            resize: vertical;
            font-family: inherit;
            font-size: 14px;
        }

        .moment-input textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .moment-list {
            background: white;
            border-radius: 15px;
            padding: 20px;
        }

        .moment-item {
            padding: 20px;
            border-bottom: 1px solid #f0f0f0;
        }

        .moment-item:last-child {
            border-bottom: none;
        }

        .moment-header {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .moment-author {
            font-weight: bold;
            color: #2c3e50;
        }

        .moment-account {
            color: #999;
            font-size: 12px;
            margin-left: 10px;
        }

        .moment-time {
            color: #999;
            font-size: 12px;
            margin-left: auto;
        }

        .moment-content {
            color: #333;
            line-height: 1.6;
        }

        /* 个人信息页面 */
        .profile-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
        }

        .profile-row {
            display: flex;
            padding: 15px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .profile-row:last-child {
            border-bottom: none;
        }

        .profile-label {
            width: 120px;
            color: #666;
            font-weight: bold;
        }

        .profile-value {
            flex: 1;
            color: #333;
        }

        .edit-form {
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .edit-form input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .edit-form input:focus {
            outline: none;
            border-color: #667eea;
        }

        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 15px 30px;
            border-radius: 10px;
            z-index: 1000;
            display: none;
        }

        .toast.show {
            display: block;
            animation: fadeInOut 2s ease-in-out;
        }

        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
            20% { opacity: 1; transform: translateX(-50%) translateY(0); }
            80% { opacity: 1; transform: translateX(-50%) translateY(0); }
            100% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 400px;
            width: 90%;
        }

        .modal-title {
            font-size: 18px;
            margin-bottom: 20px;
            color: #2c3e50;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state .icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <!-- 登录页面 -->
    <div id="loginPage" class="auth-container">
        <h1>🌐 社交系统</h1>
        <form class="auth-form" onsubmit="handleLogin(event)">
            <input type="text" id="loginAccount" placeholder="请输入账号" required>
            <input type="password" id="loginPassword" placeholder="请输入密码" required>
            <button type="submit">登 录</button>
        </form>
        <p class="auth-toggle">还没有账号？<a onclick="showRegister()">立即注册</a></p>
    </div>

    <!-- 注册页面 -->
    <div id="registerPage" class="auth-container hidden">
        <h1>🌐 注册新账号</h1>
        <form class="auth-form" onsubmit="handleRegister(event)">
            <input type="text" id="regAccount" placeholder="请输入账号" required>
            <input type="password" id="regPassword" placeholder="请输入密码" required>
            <input type="text" id="regName" placeholder="请输入用户名" required>
            <button type="submit">注 册</button>
        </form>
        <p class="auth-toggle">已有账号？<a onclick="showLogin()">返回登录</a></p>
    </div>

    <!-- 主界面 -->
    <div id="mainContainer" class="container">
        <!-- 侧边栏 -->
        <div class="sidebar">
            <div class="user-info">
                <div class="user-avatar" id="userAvatar">👤</div>
                <div class="user-name" id="userName">用户</div>
                <div class="user-account" id="userAccount">0000</div>
            </div>

            <div class="nav-menu">
                <div class="nav-item active" data-page="messages" onclick="switchPage('messages')">
                    <span class="icon">💬</span>
                    <span>消息</span>
                </div>
                <div class="nav-item" data-page="contacts" onclick="switchPage('contacts')">
                    <span class="icon">👥</span>
                    <span>联系人</span>
                </div>
                <div class="nav-item" data-page="moments" onclick="switchPage('moments')">
                    <span class="icon">📝</span>
                    <span>动态</span>
                </div>
                <div class="nav-item" data-page="profile" onclick="switchPage('profile')">
                    <span class="icon">👤</span>
                    <span>个人信息</span>
                </div>
            </div>

            <button class="logout-btn" onclick="handleLogout()">退出登录</button>
        </div>

        <!-- 主内容区 -->
        <div class="main-content">
            <!-- 消息页面 -->
            <div id="page-messages" class="page-content">
                <div class="content-header">
                    <h2>💬 消息</h2>
                </div>
                <div class="content-body">
                    <div id="friendListPanel" class="friend-list">
                        <h3 style="margin-bottom: 15px;">好友列表</h3>
                        <div id="friendsContainer"></div>
                    </div>
                    <div id="chatWindowPanel" class="chat-window hidden">
                        <div class="chat-messages" id="chatMessages"></div>
                        <div class="chat-input">
                            <input type="text" id="messageInput" placeholder="输入消息..." onkeypress="if(event.key==='Enter')sendMessage()">
                            <button onclick="sendMessage()">发送</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 联系人页面 -->
            <div id="page-contacts" class="page-content hidden">
                <div class="content-header">
                    <h2>👥 联系人</h2>
                </div>
                <div class="content-body">
                    <div class="contact-section">
                        <h3>我的好友</h3>
                        <div id="contactFriendsList"></div>
                        <div class="contact-actions">
                            <button class="btn btn-primary" onclick="showAddFriendModal()">添加好友</button>
                            <button class="btn btn-danger" onclick="showRemoveFriendModal()">删除好友</button>
                        </div>
                    </div>

                    <div class="contact-section">
                        <h3>黑名单</h3>
                        <div id="blackListContainer"></div>
                        <div class="contact-actions">
                            <button class="btn btn-danger" onclick="showAddBlackModal()">加入黑名单</button>
                            <button class="btn btn-success" onclick="showRemoveBlackModal()">移出黑名单</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 动态页面 -->
            <div id="page-moments" class="page-content hidden">
                <div class="content-header">
                    <h2>📝 动态</h2>
                </div>
                <div class="content-body">
                    <div class="moment-input">
                        <textarea id="momentContent" placeholder="分享你的想法..."></textarea>
                        <button class="btn btn-primary" style="margin-top: 15px;" onclick="publishMoment()">发布动态</button>
                    </div>
                    <div class="moment-list" id="momentsContainer"></div>
                </div>
            </div>

            <!-- 个人信息页面 -->
            <div id="page-profile" class="page-content hidden">
                <div class="content-header">
                    <h2>👤 个人信息</h2>
                </div>
                <div class="content-body">
                    <div class="profile-card">
                        <div class="profile-row">
                            <span class="profile-label">用户 ID:</span>
                            <span class="profile-value" id="profileId">-</span>
                        </div>
                        <div class="profile-row">
                            <span class="profile-label">登录账号:</span>
                            <span class="profile-value" id="profileAccount">-</span>
                        </div>
                        <div class="profile-row">
                            <span class="profile-label">用户名:</span>
                            <span class="profile-value" id="profileName">-</span>
                        </div>
                        <div class="profile-row">
                            <span class="profile-label">所在地:</span>
                            <span class="profile-value" id="profileLocation">-</span>
                        </div>
                        <div class="profile-row">
                            <span class="profile-label">个性签名:</span>
                            <span class="profile-value" id="profileSignature">-</span>
                        </div>
                        <div class="profile-row">
                            <span class="profile-label">好友数量:</span>
                            <span class="profile-value" id="profileFriendCount">0</span>
                        </div>
                        <div class="profile-row">
                            <span class="profile-label">黑名单数量:</span>
                            <span class="profile-value" id="profileBlackCount">0</span>
                        </div>

                        <div style="margin-top: 20px;">
                            <button class="btn btn-primary" onclick="showEditProfile()">修改信息</button>
                            <button class="btn btn-danger" onclick="confirmDeleteAccount()">注销账号</button>
                        </div>

                        <div id="editProfileForm" class="edit-form hidden">
                            <h4 style="margin-bottom: 15px;">修改个人信息</h4>
                            <input type="text" id="editName" placeholder="新用户名">
                            <input type="text" id="editLocation" placeholder="新所在地">
                            <input type="text" id="editSignature" placeholder="新个性签名">
                            <button class="btn btn-primary" onclick="saveProfileChanges()">保存修改</button>
                            <button class="btn" onclick="hideEditProfile()" style="background: #ccc;">取消</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 添加好友弹窗 -->
    <div id="addFriendModal" class="modal">
        <div class="modal-content">
            <h3 class="modal-title">添加好友</h3>
            <input type="text" id="addFriendAccount" placeholder="请输入对方账号" style="width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px;">
            <div class="modal-buttons">
                <button class="btn btn-primary" onclick="addFriend()">确定</button>
                <button class="btn" onclick="closeModal('addFriendModal')" style="background: #ccc;">取消</button>
            </div>
        </div>
    </div>

    <!-- 删除好友弹窗 -->
    <div id="removeFriendModal" class="modal">
        <div class="modal-content">
            <h3 class="modal-title">删除好友</h3>
            <input type="text" id="removeFriendAccount" placeholder="请输入对方账号" style="width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px;">
            <div class="modal-buttons">
                <button class="btn btn-danger" onclick="removeFriend()">确定</button>
                <button class="btn" onclick="closeModal('removeFriendModal')" style="background: #ccc;">取消</button>
            </div>
        </div>
    </div>

    <!-- 加入黑名单弹窗 -->
    <div id="addBlackModal" class="modal">
        <div class="modal-content">
            <h3 class="modal-title">加入黑名单</h3>
            <input type="text" id="addBlackAccount" placeholder="请输入对方账号" style="width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px;">
            <div class="modal-buttons">
                <button class="btn btn-danger" onclick="addToBlacklist()">确定</button>
                <button class="btn" onclick="closeModal('addBlackModal')" style="background: #ccc;">取消</button>
            </div>
        </div>
    </div>

    <!-- 移出黑名单弹窗 -->
    <div id="removeBlackModal" class="modal">
        <div class="modal-content">
            <h3 class="modal-title">移出黑名单</h3>
            <input type="text" id="removeBlackAccount" placeholder="请输入对方账号" style="width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px;">
            <div class="modal-buttons">
                <button class="btn btn-success" onclick="removeFromBlacklist()">确定</button>
                <button class="btn" onclick="closeModal('removeBlackModal')" style="background: #ccc;">取消</button>
            </div>
        </div>
    </div>

    <!-- 确认注销账号弹窗 -->
    <div id="deleteAccountModal" class="modal">
        <div class="modal-content">
            <h3 class="modal-title" style="color: #e74c3c;">⚠️ 确认注销账号</h3>
            <p style="color: #666; margin-bottom: 20px;">注销后所有数据将永久删除且无法恢复，确定继续吗？</p>
            <div class="modal-buttons">
                <button class="btn btn-danger" onclick="deleteAccount()">确认注销</button>
                <button class="btn" onclick="closeModal('deleteAccountModal')" style="background: #ccc;">取消</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        // ==================== 数据存储 ====================
        let users = JSON.parse(localStorage.getItem('users')) || [];
        let chats = JSON.parse(localStorage.getItem('chats')) || [];
        let moments = JSON.parse(localStorage.getItem('moments')) || [];
        let currentUser = null;
        let currentChatTarget = null;
        let nextUserId = users.length > 0 ? Math.max(...users.map(u => u.userId)) + 1 : 1;

        // ==================== 工具函数 ====================
        function saveData() {
            localStorage.setItem('users', JSON.stringify(users));
            localStorage.setItem('chats', JSON.stringify(chats));
            localStorage.setItem('moments', JSON.stringify(moments));
        }

        function getCurrentTime() {
            const now = new Date();
            return now.getFullYear() + '-' +
                   String(now.getMonth() + 1).padStart(2, '0') + '-' +
                   String(now.getDate()).padStart(2, '0') + ' ' +
                   String(now.getHours()).padStart(2, '0') + ':' +
                   String(now.getMinutes()).padStart(2, '0');
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function showModal(id) {
            document.getElementById(id).classList.add('show');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('show');
        }

        // ==================== 认证功能 ====================
        function showRegister() {
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('registerPage').classList.remove('hidden');
        }

        function showLogin() {
            document.getElementById('registerPage').classList.add('hidden');
            document.getElementById('loginPage').classList.remove('hidden');
        }

        function handleLogin(e) {
            e.preventDefault();
            const account = document.getElementById('loginAccount').value;
            const password = document.getElementById('loginPassword').value;

            const user = users.find(u => u.account === account && u.password === password);
            if (user) {
                currentUser = user;
                document.getElementById('loginPage').classList.add('hidden');
                document.getElementById('mainContainer').classList.add('active');
                initializeUI();
                showToast('登录成功，欢迎 ' + user.name + '！');
            } else {
                showToast('账号或密码错误！');
            }
        }

        function handleRegister(e) {
            e.preventDefault();
            const account = document.getElementById('regAccount').value;
            const password = document.getElementById('regPassword').value;
            const name = document.getElementById('regName').value;

            if (users.some(u => u.account === account)) {
                showToast('注册失败，账号已存在');
                return;
            }
            if (users.some(u => u.name === name)) {
                showToast('注册失败，用户名已被占用');
                return;
            }

            const newUser = {
                userId: nextUserId++,
                account: account,
                password: password,
                name: name,
                location: '未设置',
                signature: '暂无签名',
                friendList: [],
                blackList: []
            };

            users.push(newUser);
            saveData();
            showToast('注册成功！请登录');
            showLogin();
        }

        function handleLogout() {
            saveData();
            currentUser = null;
            currentChatTarget = null;
            document.getElementById('mainContainer').classList.remove('active');
            document.getElementById('loginPage').classList.remove('hidden');
            document.getElementById('loginAccount').value = '';
            document.getElementById('loginPassword').value = '';
            showToast('已退出登录');
        }

        // ==================== 页面切换 ====================
        function switchPage(page) {
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.toggle('active', item.dataset.page === page);
            });
            document.querySelectorAll('.page-content').forEach(content => {
                content.classList.add('hidden');
            });
            document.getElementById('page-' + page).classList.remove('hidden');

            // 刷新对应页面内容
            if (page === 'messages') renderFriendList();
            if (page === 'contacts') renderContacts();
            if (page === 'moments') renderMoments();
            if (page === 'profile') renderProfile();
        }

        // ==================== 初始化 UI ====================
        function initializeUI() {
            document.getElementById('userName').textContent = currentUser.name;
            document.getElementById('userAccount').textContent = currentUser.account;
            document.getElementById('userAvatar').textContent = currentUser.name.charAt(0);
            switchPage('messages');
        }

        // ==================== 消息功能 ====================
        function renderFriendList() {
            const container = document.getElementById('friendsContainer');
            const me = getCurrentUserData();

            if (!me.friendList || me.friendList.length === 0) {
                container.innerHTML = '<div class="empty-state"><div class="icon">👥</div><p>你还没有好友，快去添加吧！</p></div>';
                return;
            }

            container.innerHTML = '';
            me.friendList.forEach(friendId => {
                const friend = users.find(u => u.userId === friendId);
                if (friend) {
                    const div = document.createElement('div');
                    div.className = 'friend-item';
                    div.innerHTML = `
                        <div class="friend-avatar">${friend.name.charAt(0)}</div>
                        <span>${friend.name}</span>
                    `;
                    div.onclick = () => openChat(friend);
                    container.appendChild(div);
                }
            });
        }

        function getCurrentUserData() {
            return users.find(u => u.userId === currentUser.userId);
        }

        function openChat(friend) {
            currentChatTarget = friend;
            document.getElementById('friendListPanel').classList.add('hidden');
            document.getElementById('chatWindowPanel').classList.remove('hidden');
            renderChatMessages();
        }

        function renderChatMessages() {
            if (!currentChatTarget) return;

            const container = document.getElementById('chatMessages');
            const myId = currentUser.userId;
            const friendId = currentChatTarget.userId;

            const messages = chats.filter(c =>
                (c.fromId === myId && c.toId === friendId) ||
                (c.fromId === friendId && c.toId === myId)
            );

            if (messages.length === 0) {
                container.innerHTML = '<div class="empty-state"><p>暂无聊天记录</p></div>';
            } else {
                container.innerHTML = '';
                messages.forEach(msg => {
                    const isSent = msg.fromId === myId;
                    const sender = users.find(u => u.userId === msg.fromId);
                    const div = document.createElement('div');
                    div.className = 'message ' + (isSent ? 'sent' : 'received');
                    div.innerHTML = `
                        <div class="message-content">
                            ${msg.content}
                            <div class="message-time">${msg.time}</div>
                        </div>
                    `;
                    container.appendChild(div);
                });
            }
            container.scrollTop = container.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const content = input.value.trim();

            if (!content || !currentChatTarget) return;

            chats.push({
                fromId: currentUser.userId,
                toId: currentChatTarget.userId,
                content: content,
                time: getCurrentTime()
            });
            saveData();

            input.value = '';
            renderChatMessages();
        }

        // ==================== 联系人功能 ====================
        function renderContacts() {
            const me = getCurrentUserData();

            // 渲染好友列表
            const friendsContainer = document.getElementById('contactFriendsList');
            if (!me.friendList || me.friendList.length === 0) {
                friendsContainer.innerHTML = '<p style="color: #999; padding: 15px 0;">暂无好友</p>';
            } else {
                friendsContainer.innerHTML = '';
                me.friendList.forEach(friendId => {
                    const friend = users.find(u => u.userId === friendId);
                    if (friend) {
                        const div = document.createElement('div');
                        div.style.padding = '10px 0';
                        div.innerHTML = `<span>👤 ${friend.name}（${friend.account}）</span>`;
                        friendsContainer.appendChild(div);
                    }
                });
            }

            // 渲染黑名单
            const blackContainer = document.getElementById('blackListContainer');
            if (!me.blackList || me.blackList.length === 0) {
                blackContainer.innerHTML = '<p style="color: #999; padding: 15px 0;">黑名单为空</p>';
            } else {
                blackContainer.innerHTML = '';
                me.blackList.forEach(blackId => {
                    const black = users.find(u => u.userId === blackId);
                    if (black) {
                        const div = document.createElement('div');
                        div.style.padding = '10px 0';
                        div.innerHTML = `<span>🚫 ${black.name}（${black.account}）</span>`;
                        blackContainer.appendChild(div);
                    }
                });
            }
        }

        function showAddFriendModal() {
            document.getElementById('addFriendAccount').value = '';
            showModal('addFriendModal');
        }

        function addFriend() {
            const account = document.getElementById('addFriendAccount').value.trim();
            if (!account) {
                showToast('请输入对方账号');
                return;
            }

            const target = users.find(u => u.account === account);
            const me = getCurrentUserData();

            if (!target) {
                showToast('添加失败，账号不存在');
                closeModal('addFriendModal');
                return;
            }

            if (target.userId === me.userId) {
                showToast('不能添加自己为好友');
                closeModal('addFriendModal');
                return;
            }

            if (me.friendList.includes(target.userId)) {
                showToast('已经是好友了');
                closeModal('addFriendModal');
                return;
            }

            if (me.blackList.includes(target.userId) || target.blackList.includes(me.userId)) {
                showToast('添加失败，已被拉黑');
                closeModal('addFriendModal');
                return;
            }

            me.friendList.push(target.userId);
            target.friendList.push(me.userId);
            saveData();

            showToast('添加好友成功！');
            closeModal('addFriendModal');
            renderContacts();
        }

        function showRemoveFriendModal() {
            document.getElementById('removeFriendAccount').value = '';
            showModal('removeFriendModal');
        }

        function removeFriend() {
            const account = document.getElementById('removeFriendAccount').value.trim();
            if (!account) {
                showToast('请输入对方账号');
                return;
            }

            const target = users.find(u => u.account === account);
            const me = getCurrentUserData();

            if (!target || !me.friendList.includes(target.userId)) {
                showToast('删除失败，该用户不在好友列表中');
                closeModal('removeFriendModal');
                return;
            }

            me.friendList = me.friendList.filter(id => id !== target.userId);
            target.friendList = target.friendList.filter(id => id !== me.userId);
            saveData();

            showToast('删除好友成功！');
            closeModal('removeFriendModal');
            renderContacts();
        }

        function showAddBlackModal() {
            document.getElementById('addBlackAccount').value = '';
            showModal('addBlackModal');
        }

        function addToBlacklist() {
            const account = document.getElementById('addBlackAccount').value.trim();
            if (!account) {
                showToast('请输入对方账号');
                return;
            }

            const target = users.find(u => u.account === account);
            const me = getCurrentUserData();

            if (!target) {
                showToast('操作失败，账号不存在');
                closeModal('addBlackModal');
                return;
            }

            if (target.userId === me.userId) {
                showToast('不能拉黑自己');
                closeModal('addBlackModal');
                return;
            }

            if (me.blackList.includes(target.userId)) {
                showToast('已在黑名单中');
                closeModal('addBlackModal');
                return;
            }

            me.blackList.push(target.userId);
            // 自动删除好友关系
            me.friendList = me.friendList.filter(id => id !== target.userId);
            target.friendList = target.friendList.filter(id => id !== me.userId);
            saveData();

            showToast('已加入黑名单，双方好友关系已解除');
            closeModal('addBlackModal');
            renderContacts();
        }

        function showRemoveBlackModal() {
            document.getElementById('removeBlackAccount').value = '';
            showModal('removeBlackModal');
        }

        function removeFromBlacklist() {
            const account = document.getElementById('removeBlackAccount').value.trim();
            if (!account) {
                showToast('请输入对方账号');
                return;
            }

            const target = users.find(u => u.account === account);
            const me = getCurrentUserData();

            if (!target || !me.blackList.includes(target.userId)) {
                showToast('操作失败，该账号不在黑名单中');
                closeModal('removeBlackModal');
                return;
            }

            me.blackList = me.blackList.filter(id => id !== target.userId);
            saveData();

            showToast('已移出黑名单');
            closeModal('removeBlackModal');
            renderContacts();
        }

        // ==================== 动态功能 ====================
        function renderMoments() {
            const container = document.getElementById('momentsContainer');

            if (moments.length === 0) {
                container.innerHTML = '<div class="empty-state"><div class="icon">📝</div><p>还没有人发布动态</p></div>';
                return;
            }

            container.innerHTML = '';
            moments.slice().reverse().forEach(moment => {
                const author = users.find(u => u.userId === moment.userId);
                const div = document.createElement('div');
                div.className = 'moment-item';
                div.innerHTML = `
                    <div class="moment-header">
                        <span class="moment-author">${author ? author.name : '未知用户'}</span>
                        <span class="moment-account">（账号：${author ? author.account : '0000'}）</span>
                        <span class="moment-time">${moment.time}</span>
                    </div>
                    <div class="moment-content">${moment.content}</div>
                `;
                container.appendChild(div);
            });
        }

        function publishMoment() {
            const content = document.getElementById('momentContent').value.trim();
            if (!content) {
                showToast('动态内容不能为空');
                return;
            }

            moments.push({
                userId: currentUser.userId,
                content: content,
                time: getCurrentTime()
            });
            saveData();

            document.getElementById('momentContent').value = '';
            showToast('发布成功！');
            renderMoments();
        }

        // ==================== 个人信息功能 ====================
        function renderProfile() {
            const me = getCurrentUserData();

            document.getElementById('profileId').textContent = me.userId;
            document.getElementById('profileAccount').textContent = me.account;
            document.getElementById('profileName').textContent = me.name;
            document.getElementById('profileLocation').textContent = me.location;
            document.getElementById('profileSignature').textContent = me.signature;
            document.getElementById('profileFriendCount').textContent = (me.friendList || []).length;
            document.getElementById('profileBlackCount').textContent = (me.blackList || []).length;
        }

        function showEditProfile() {
            document.getElementById('editName').value = currentUser.name;
            document.getElementById('editLocation').value = currentUser.location;
            document.getElementById('editSignature').value = currentUser.signature;
            document.getElementById('editProfileForm').classList.remove('hidden');
        }

        function hideEditProfile() {
            document.getElementById('editProfileForm').classList.add('hidden');
        }

        function saveProfileChanges() {
            const newName = document.getElementById('editName').value.trim();
            const newLocation = document.getElementById('editLocation').value.trim();
            const newSignature = document.getElementById('editSignature').value.trim();

            const me = getCurrentUserData();

            if (!newName || !newLocation || !newSignature) {
                showToast('所有字段都不能为空');
                return;
            }

            // 检查用户名是否重复
            const existingUser = users.find(u => u.name === newName && u.userId !== me.userId);
            if (existingUser) {
                showToast('修改失败，该用户名已被占用');
                return;
            }

            me.name = newName;
            me.location = newLocation;
            me.signature = newSignature;
            saveData();

            currentUser.name = newName;
            document.getElementById('userName').textContent = newName;
            document.getElementById('userAvatar').textContent = newName.charAt(0);

            showToast('修改成功！');
            hideEditProfile();
            renderProfile();
        }

        function confirmDeleteAccount() {
            showModal('deleteAccountModal');
        }

        function deleteAccount() {
            const me = getCurrentUserData();

            // 清除其他用户中的好友关系和黑名单中的该用户
            users.forEach(u => {
                u.friendList = u.friendList.filter(id => id !== me.userId);
                u.blackList = u.blackList.filter(id => id !== me.userId);
            });

            // 删除用户
            users = users.filter(u => u.userId !== me.userId);

            // 清除该用户的聊天记录和动态
            chats = chats.filter(c => c.fromId !== me.userId && c.toId !== me.userId);
            moments = moments.filter(m => m.userId !== me.userId);

            saveData();

            closeModal('deleteAccountModal');
            handleLogout();
            showToast('账号已注销');
        }

        // 页面加载时检查是否有数据
        if (users.length === 0) {
            console.log('首次使用，请注册账号开始使用社交系统');
        }
    </script>
</body>
</html>
